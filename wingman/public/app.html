<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wingman</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#111113;--s:#18181b;--ln:#27272b;--tx:#e8e8ec;--mu:#8c8c96;--ac:#8d9bff;--ok:#6fcf97;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:210px minmax(0,640px);justify-content:center;gap:0 48px;max-width:960px;margin:0 auto}
.solo .app{display:block;max-width:440px;padding:0 20px}.solo #side,.solo #bnav,.solo .top{display:none}
#side{position:sticky;top:0;height:100vh;padding:28px 0;display:flex;flex-direction:column;gap:2px}
.wm{font-weight:600;font-size:1.1rem;letter-spacing:-.02em;margin-bottom:22px}
.nv{padding:8px 12px;margin-left:-12px;border-radius:8px;color:var(--mu);display:flex;justify-content:space-between;transition:color .15s,background .15s}
.nv:hover{color:var(--tx);background:var(--s)}.nv.on{color:var(--tx);font-weight:500}
.nv em{font-style:normal;color:var(--ac);font-size:.8rem}
.who{margin-top:auto;display:flex;gap:10px;align-items:center;font-size:.85rem}.who small{display:block;color:var(--mu)}
main{min-width:0;padding:28px 0 60px}
.top{display:none}.bnav{display:none}
h1{font-size:1.3rem;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 22px;font-size:.9rem}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:#d7d7de;flex:none}
.post{display:flex;gap:14px;padding:20px 0;border-top:1px solid var(--ln)}
.post:first-of-type{border-top:0}
.pb{flex:1;min-width:0}
.pt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.pt span,.mt{color:var(--mu);font-size:.84rem}
.post h3{font-size:1.05rem;font-weight:600;margin:6px 0 4px;line-height:1.35;letter-spacing:-.01em}
.bd{margin:0;color:#c8c8d0;white-space:pre-wrap;word-wrap:break-word}
.cl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mt{margin-top:8px}
.sc{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.84rem;color:var(--mu)}.sc b{color:var(--tx);font-size:.95rem}
.sc i,.br i{display:block;flex:0 0 90px;height:4px;border-radius:4px;background:var(--ln);overflow:hidden}
.sc u,.br u{display:block;height:100%;background:var(--ac);transition:width .5s}
.ac{display:flex;gap:2px;margin:10px 0 0 -8px;flex-wrap:wrap;align-items:center}
.lk{background:none;border:0;color:var(--mu);font-size:.84rem;padding:6px 8px;border-radius:7px;transition:.15s}.lk:hover{color:var(--tx);background:var(--s)}.lk.on{color:var(--ac)}
.sp{flex:1}
.dt{margin-top:12px;padding-top:14px;border-top:1px solid var(--ln);animation:f .2s}
@keyframes f{from{opacity:0}to{opacity:1}}
.br{display:grid;grid-template-columns:130px 1fr 30px;gap:10px;align-items:center;font-size:.82rem;color:var(--mu);margin:7px 0}.br i{flex:auto}.br b{color:var(--tx);font-weight:500;text-align:right}
.sl{display:grid;grid-template-columns:130px 1fr 24px;gap:10px;align-items:center;font-size:.84rem;color:var(--mu);margin:8px 0}.sl output{color:var(--tx)}
input[type=range]{accent-color:var(--ac);width:100%}
h4{font-size:.84rem;font-weight:500;color:var(--mu);margin:20px 0 6px}
.inp{width:100%;background:var(--s);border:1px solid var(--ln);border-radius:9px;padding:10px 12px;outline:0;transition:border-color .15s}.inp:focus{border-color:var(--ac)}
textarea.inp{min-height:110px;resize:vertical}
.btn{border:0;border-radius:9px;padding:10px 18px;font-weight:500;background:var(--ac);color:#101018;transition:opacity .15s}.btn:hover{opacity:.88}
.btn.o{background:none;box-shadow:inset 0 0 0 1px var(--ln);color:var(--tx)}.btn.s{padding:6px 12px;font-size:.85rem}.btn:disabled{opacity:.4}
.cm{display:flex;gap:10px;margin:14px 0;font-size:.9rem}.cm p{margin:1px 0;word-wrap:break-word}.cm .t{color:var(--mu);font-size:.78rem;margin-left:6px}
.cm .rp{margin-left:0}.rps{margin-left:38px}.men{color:var(--ac)}
.cmp{display:flex;gap:8px;margin-top:12px}.rt{font-size:.8rem;color:var(--mu);margin-top:8px}
.nt2{color:var(--mu);font-size:.86rem;margin:10px 0}
.list>div{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--ln)}.list>div:first-child{border-top:0}
.list .pm{flex:1;min-width:0}.pm small{display:block;color:var(--mu);font-size:.82rem}
.sec{color:var(--mu);font-size:.84rem;margin:28px 0 4px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--ln);margin-bottom:6px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 0;color:var(--mu);white-space:nowrap}.tabs button.on{color:var(--tx);border-color:var(--ac)}
.rk{width:22px;color:var(--mu);font-variant-numeric:tabular-nums}
.nt{display:block;padding:14px 0 14px 14px;border-top:1px solid var(--ln);color:var(--mu);position:relative}.nt:first-child{border-top:0}
.nt.un{color:var(--tx)}.nt.un::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;background:var(--ac);border-radius:2px}
.nt small{display:block;font-size:.78rem;color:var(--mu)}
.f{margin-bottom:18px}.f label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:none;border-radius:99px;padding:6px 13px;font-size:.85rem;color:var(--mu)}.chip.on{border-color:var(--ac);color:var(--tx)}
.empty{padding:44px 0;max-width:380px}.empty h2{font-size:1.1rem;font-weight:600;margin:0 0 6px}.empty p{color:var(--mu);margin:0 0 18px}
.empty .row{display:flex;gap:8px}
.ph{display:flex;gap:18px;align-items:center;margin-bottom:18px}.ph h1{margin:0}
.fig{display:flex;gap:28px;margin:6px 0 4px;flex-wrap:wrap}.fig b{display:block;font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}.fig span{color:var(--mu);font-size:.82rem}
.rd{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center;margin-top:8px}.radar{width:100%}
.err{color:#e58a8a;font-size:.84rem;margin-top:6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:#111;padding:9px 16px;border-radius:8px;font-size:.86rem;opacity:0;transition:opacity .2s;z-index:40;pointer-events:none}#toast.on{opacity:1}
@media(max-width:860px){
.app{display:block;padding:0 18px}#side{display:none}
.top{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;justify-content:space-between;align-items:center;padding:12px 0;background:var(--bg);border-bottom:1px solid var(--ln);margin:0 -18px;padding-inline:18px}
.top a:last-child{color:var(--mu);font-size:.9rem}.top em{font-style:normal;color:var(--ac)}
main{padding:20px 0 100px}
.bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--ln);padding:0 4px calc(env(safe-area-inset-bottom,0px))}
.bnav a{flex:1;text-align:center;padding:14px 0 12px;font-size:.78rem;color:var(--mu);border-top:2px solid transparent;margin-top:-1px}.bnav a.on{color:var(--tx);border-color:var(--ac)}
input,select,textarea{font-size:16px}
.br,.sl{grid-template-columns:96px 1fr 28px}.rd{grid-template-columns:1fr}.post{gap:12px}.lk{padding:9px 10px}
.solo .app{padding:0 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main><div class="top" id="top"></div><div id="main"></div></main>
</div>
<nav class="bnav" id="bnav"></nav>
<div id="toast"></div>
<script src="js/app.js"></script>
</body></html>
